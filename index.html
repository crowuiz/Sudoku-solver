<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>数独サポート</title>
  <style>
    :root{color-scheme:light;--ink:#17243b;--muted:#64748b;--line:#d6deea;--blue:#2563eb;--red:#dc2626;--green:#15803d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 14px 44px;color:var(--ink);background:radial-gradient(circle at 50% 0,#eaf1ff,#f8fafc 480px);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,720px);margin:auto}header{text-align:center;margin-bottom:20px}h1{margin:0 0 7px;font-size:clamp(1.7rem,5vw,2.2rem)}header p{margin:0;color:var(--muted)}
    .panel{padding:clamp(13px,4vw,25px);border:1px solid #e1e7f0;border-radius:20px;background:#fff;box-shadow:0 16px 40px #1e3a8a12}
    .board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));width:min(100%,540px);aspect-ratio:1;margin:auto;overflow:hidden;border:2px solid #24344e;border-radius:5px}
    .cell{position:relative;display:grid;min-width:0;min-height:0;place-items:center;padding:0;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff;color:#17243b;font:inherit;font-size:clamp(1rem,5.3vw,2rem);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .cell:nth-child(3n){border-right:2px solid #52627a}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #52627a}.cell:nth-child(n+73){border-bottom:0}
    .cell:hover,.cell.related{background:#f0f5ff}.cell.same-number{background:#dce8ff;color:#1745a3}.cell.selected{z-index:1;background:#c9dcff;box-shadow:inset 0 0 0 3px var(--blue)}.cell.conflict{z-index:2;background:#fee2e2;color:#b91c1c}.cell.conflict.selected{box-shadow:inset 0 0 0 3px var(--red)}.cell.assumption-value{color:var(--green);font-weight:750}.cell:focus-visible{z-index:3;outline:3px solid #7c3aed;outline-offset:-3px}
    .notes{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);color:#64748b;font-size:clamp(.42rem,1.65vw,.72rem);line-height:1;pointer-events:none}.notes span{display:grid;place-items:center}.notes span.forced{border-radius:50%;background:#fbbf24;color:#713f12;font-weight:800;box-shadow:0 0 0 1px #d97706}.notes span.matching-note{border-radius:50%;background:#bfdbfe;color:#1d4ed8;font-weight:800;box-shadow:0 0 0 1px #3b82f6}.notes span.matching-note.forced{background:#fbbf24;color:#713f12;box-shadow:0 0 0 2px #2563eb}
    .toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:17px 0 13px}.control,.number-pad button{min-height:42px;padding:8px 13px;border:1px solid #d5deeb;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:650;cursor:pointer}.control:hover,.number-pad button:hover{border-color:#8eaae0;background:#f3f7ff}.control[aria-pressed=true]{border-color:var(--blue);background:#e8f0ff;color:#1745a3}.control.assumption-toggle[aria-pressed=true]{border-color:#16a34a;background:#dcfce7;color:#166534}
    .number-pad{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}.number-pad button{display:block;min-width:0;min-height:52px;padding:10px 3px;font-size:1.12rem;line-height:1.2;visibility:visible;opacity:1}.number-pad .erase{font-size:.9rem}
    .help{margin:13px 0 0;color:var(--muted);text-align:center;font-size:.86rem;line-height:1.65}.status{min-height:1.4em;margin:9px 0 0;color:#b91c1c;text-align:center;font-size:.9rem}
    @media(max-width:440px){body{padding:20px 9px 30px}.number-pad{gap:6px}.number-pad button{min-height:50px;padding:8px 1px;font-size:1.05rem}.control{flex:1 1 auto;padding-inline:8px;font-size:.88rem}}
  </style>
</head>
<body>
<main>
  <header><h1>数独サポート</h1><p>マスを選んで数字や候補を入力しましょう。</p></header>
  <section class="panel" aria-label="数独入力">
    <div id="board" class="board" role="grid" aria-label="数独 9×9"></div>
    <div class="toolbar">
      <button id="notesMode" class="control" type="button" aria-pressed="false">✎ メモ：オフ</button>
      <button id="fillCandidates" class="control" type="button">候補を自動入力</button>
      <button id="forcedMode" class="control" type="button" aria-pressed="true">確定表示：オン</button>
      <button id="assumptionMode" class="control assumption-toggle" type="button" aria-pressed="false">仮定：オフ</button>
      <button id="clearBoard" class="control" type="button">盤面をクリア</button>
    </div>
    <div id="numberPad" class="number-pad" aria-label="数字入力"></div>
    <p id="status" class="status" aria-live="polite"></p>
    <p class="help">数字のマスを選ぶと、同じ数字のマスとメモが強調表示されます。重複した数字は赤く表示されます。<br>黄色で囲まれた候補は「確定」です。仮定モードでは、すでに入力されている数字は変更できず、新しく入力した数字は緑色で表示されます。仮定モードをオフにすると、仮定で入力した数字が消えます。</p>
  </section>
</main>
<script>
(()=>{
  'use strict';
  const boardElement=document.getElementById('board'),padElement=document.getElementById('numberPad'),statusElement=document.getElementById('status');
  const values=new Uint8Array(81),notes=Array.from({length:81},()=>new Set()),cells=[],assumptions=new Uint8Array(81),lockedValues=new Uint8Array(81);
  let selected=null,notesMode=false,showForced=true,assumptionMode=false,renderQueued=false;
  const peers=Array.from({length:81},(_,index)=>{const row=(index/9)|0,col=index%9,br=(row/3|0)*3,bc=(col/3|0)*3,result=new Set();for(let i=0;i<9;i++){result.add(row*9+i);result.add(i*9+col)}for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)result.add(r*9+c);result.delete(index);return result});
  const units=Array.from({length:81},(_,index)=>{const row=(index/9)|0,col=index%9,br=(row/3|0)*3,bc=(col/3|0)*3,rowUnit=[],columnUnit=[],box=[];for(let i=0;i<9;i++){rowUnit.push(row*9+i);columnUnit.push(i*9+col)}for(let r=br;r<br+3;r++)for(let c=bc;c<bc+3;c++)box.push(r*9+c);return[rowUnit,columnUnit,box]});
  function conflicts(){const bad=new Set();for(let i=0;i<81;i++){if(!values[i])continue;for(const peer of peers[i])if(values[peer]===values[i]){bad.add(i);bad.add(peer)}}return bad}
  function visibleNotes(index){const result=new Set();for(const n of notes[index]){let blocked=false;for(const peer of peers[index])if(values[peer]===n){blocked=true;break}if(!blocked)result.add(n)}return result}
  function candidatesFor(index){if(notes[index].size)return visibleNotes(index);const candidates=new Set();for(let n=1;n<=9;n++){let blocked=false;for(const peer of peers[index])if(values[peer]===n){blocked=true;break}if(!blocked)candidates.add(n)}return candidates}
  function forcedCandidates(){const forced=Array.from({length:81},()=>new Set());for(let i=0;i<81;i++){if(values[i])continue;const candidates=candidatesFor(i);if(candidates.size===1)forced[i].add([...candidates][0]);for(const unit of units[i])for(let n=1;n<=9;n++){if(unit.some(cell=>values[cell]===n))continue;let possible=-1,count=0;for(const cell of unit){if(values[cell])continue;if(candidatesFor(cell).has(n)){possible=cell;if(++count>1)break}}if(count===1)forced[possible].add(n)}}return forced}
  function queueRender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}
  function render(){const bad=conflicts(),val=selected===null?0:values[selected],related=selected===null?new Set():peers[selected],forced=showForced?forcedCandidates():null;for(let i=0;i<81;i++){const cell=cells[i],shown=values[i]?null:visibleNotes(i),forcedHere=forced?forced[i]:new Set();cell.classList.toggle('selected',i===selected);cell.classList.toggle('related',related.has(i));cell.classList.toggle('same-number',Boolean(val)&&values[i]===val);cell.classList.toggle('conflict',bad.has(i));cell.classList.toggle('assumption-value',Boolean(assumptions[i]));cell.setAttribute('aria-selected',String(i===selected));const noteSignature=shown?[...shown].sort().join(','):'';const signature=[values[i],noteSignature,[...forcedHere].join(','),val,bad.has(i),assumptions[i]].join('|');if(cell._signature===signature)continue;cell._signature=signature;cell.replaceChildren();if(values[i])cell.textContent=String(values[i]);else if(shown&&shown.size){const grid=document.createElement('span');grid.className='notes';for(let n=1;n<=9;n++){const span=document.createElement('span');span.textContent=shown.has(n)?String(n):'';if(forcedHere.has(n)&&shown.has(n))span.classList.add('forced');if(val===n&&shown.has(n))span.classList.add('matching-note');grid.append(span)}cell.append(grid)}const r=(i/9|0)+1,c=i%9+1,desc=values[i]?` ${values[i]}`:shown&&shown.size?` メモ ${[...shown].sort().join(',')}`:' 空欄';cell.setAttribute('aria-label',`${r}行${c}列${desc}${forcedHere.size?` 確定候補 ${[...forcedHere].join(',')}`:''}${assumptions[i]?' 仮定の数字':''}${bad.has(i)?' 重複エラー':''}`)}statusElement.textContent=bad.size?`重複があります：赤いマスを確認してください（${bad.size}マス）。`:''}
  function enterNumber(number){if(selected===null)return;if(assumptionMode&&lockedValues[selected])return;if(notesMode){if(values[selected])return;if(notes[selected].has(number))notes[selected].delete(number);else notes[selected].add(number)}else{values[selected]=number;notes[selected].clear();assumptions[selected]=assumptionMode&&number?1:0}queueRender()}
  function makeBoard(){const fragment=document.createDocumentFragment();for(let i=0;i<81;i++){const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.setAttribute('role','gridcell');cell.addEventListener('click',()=>{selected=selected===i?null:i;queueRender()});fragment.append(cell);cells.push(cell)}boardElement.append(fragment);const padFragment=document.createDocumentFragment();for(let n=1;n<=9;n++){const b=document.createElement('button');b.type='button';b.textContent=String(n);b.setAttribute('aria-label',`${n}を入力`);b.addEventListener('click',()=>enterNumber(n));padFragment.append(b)}const erase=document.createElement('button');erase.type='button';erase.className='erase';erase.textContent='消去';erase.addEventListener('click',()=>enterNumber(0));padFragment.append(erase);padElement.append(padFragment)}
  function fillAllCandidates(){for(let i=0;i<81;i++){notes[i].clear();if(values[i])continue;for(let n=1;n<=9;n++){let used=false;for(const peer of peers[i])if(values[peer]===n){used=true;break}if(!used)notes[i].add(n)}}queueRender()}
  const notesButton=document.getElementById('notesMode');notesButton.addEventListener('click',()=>{notesMode=!notesMode;notesButton.setAttribute('aria-pressed',String(notesMode));notesButton.textContent=notesMode?'✎ メモ：オン':'✎ メモ：オ���'});
  document.getElementById('fillCandidates').addEventListener('click',fillAllCandidates);
  const forcedButton=document.getElementById('forcedMode');forcedButton.addEventListener('click',()=>{showForced=!showForced;forcedButton.setAttribute('aria-pressed',String(showForced));forcedButton.textContent=`確定表示：${showForced?'オン':'オフ'}`;queueRender()});
  const assumptionButton=document.getElementById('assumptionMode');assumptionButton.addEventListener('click',()=>{assumptionMode=!assumptionMode;assumptionButton.setAttribute('aria-pressed',String(assumptionMode));assumptionButton.textContent=`仮定：${assumptionMode?'オン':'オフ'}`;if(assumptionMode){lockedValues.set(values)}else{for(let i=0;i<81;i++){if(assumptions[i]){values[i]=0;assumptions[i]=0;notes[i].clear()}lockedValues[i]=0}}queueRender()});
  document.getElementById('clearBoard').addEventListener('click',()=>{values.fill(0);notes.forEach(n=>n.clear());assumptions.fill(0);lockedValues.fill(0);assumptionMode=false;assumptionButton.setAttribute('aria-pressed','false');assumptionButton.textContent='仮定：オフ';selected=null;queueRender()});
  document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key)){e.preventDefault();enterNumber(Number(e.key))}else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();enterNumber(0)}else if(e.key.startsWith('Arrow')){e.preventDefault();if(selected===null)selected=0;else if(e.key==='ArrowUp')selected=(selected+72)%81;else if(e.key==='ArrowDown')selected=(selected+9)%81;else if(e.key==='ArrowLeft')selected=((selected/9|0)*9+(selected%9+8)%9);else if(e.key==='ArrowRight')selected=((selected/9|0)*9+(selected%9+1)%9);queueRender();cells[selected].focus({preventScroll:true})}});
  makeBoard();queueRender();
})();
</script>
</body>
</html>
